name: E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "styles.css"
      - "manifest.json"
      - "tests/e2e/**"
      - "wdio.conf.mts"
      - "package*.json"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  # Called by the Release workflow before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (earliest and latest Obsidian)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('manifest.json', 'wdio.conf.mts') }}
          restore-keys: obsidian-cache-${{ runner.os }}-
      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y herbstluftwm dzen2 x11-xserver-utils
      - name: Start Xvfb and a window manager
        run: |
          Xvfb :99 -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 2
          herbstluftwm &
          sleep 1
      - run: npm run test:e2e
      - name: Upload reports, screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-desktop-artifacts
          path: |
            reports/e2e/
            wdio*.log
          if-no-files-found: ignore

  mobile:
    name: Mobile emulation (latest Obsidian)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('manifest.json', 'wdio.conf.mts') }}
          restore-keys: obsidian-cache-${{ runner.os }}-
      - name: Install display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y herbstluftwm dzen2 x11-xserver-utils
      - name: Start Xvfb and a window manager
        run: |
          Xvfb :99 -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 2
          herbstluftwm &
          sleep 1
      - run: npm run test:e2e:mobile
      - name: Upload reports, screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-mobile-artifacts
          path: |
            reports/e2e/
            wdio*.log
          if-no-files-found: ignore
