name: Release

# Three ways to release:
# 1. Fully automated: run this workflow manually (Actions tab, `gh workflow run release.yml -f version=minor`,
#    or an agent via the GitHub API). It bumps the version, commits, tags, checks code quality (fallow), builds,
#    tests and publishes.
# 2. Push a tag equal to the manifest.json version (e.g. `git push origin 1.2.3`).
# 3. Publish a release in the GitHub UI with a new tag equal to the manifest.json version.
# A manual run only works on the default branch (the community directory reads manifest.json from there) and needs a
# CHANGELOG.md section for the version ("## Unreleased" is renamed). If a run failed after the tag was pushed, run it
# again with version=current: it publishes the existing tag instead of bumping again.
# The end-to-end tests (e2e.yml) and the mutation tests run first and block the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version: current (release manifest version as-is), patch, minor, major, or an explicit x.y.z"
        required: true
        default: patch
      prerelease:
        description: "Mark as pre-release (the community directory ignores it)"
        type: boolean
        default: false
  push:
    tags:
      - "*.*.*"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  e2e:
    name: End-to-end tests
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  # Blocks the release: a score below `thresholds.break` in stryker.config.mjs (90 %) fails this job, and the
  # release job needs it.
  mutation:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:mutation

      - name: Mutation score summary
        if: always()
        run: node scripts/mutation-summary.mjs reports/mutation/mutation.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore

  release:
    needs: [e2e, mutation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bump version (manual run)
        if: github.event_name == 'workflow_dispatch'
        id: bump
        env:
          VERSION_INPUT: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_TYPE" != "branch" ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Run this workflow from the default branch '$DEFAULT_BRANCH' (selected: $REF_TYPE '$GITHUB_REF_NAME'). The community directory reads manifest.json from there." >&2
            exit 1
          fi
          version="$(node scripts/prepare-release.mjs "$VERSION_INPUT")"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            # Resume a run that failed after pushing the tag: same version, tag on the current commit.
            if [ "$VERSION_INPUT" = "current" ] && [ "$(git rev-parse "refs/tags/$version^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "Tag $version exists on this commit: publishing it again."
              echo "resume=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $version already exists. Choose another version, or run with version=current to finish a failed release of the commit the tag points to." >&2
              exit 1
            fi
          fi
          node scripts/release-notes.mjs "$version" --require > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          BUMPED: ${{ steps.bump.outputs.version }}
          REF_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then tag="$BUMPED"; else tag="$REF_TAG"; fi
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag '$tag' does not match manifest.json version '$version'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm run lint
      # Code quality (fallow): new dead code, duplication or complexity (not in .fallow-baselines/) is reported as
      # annotations and stops the release. Fix the finding, or re-save the baselines (npm run quality:baseline) when
      # it is accepted.
      - name: Code quality
        run: npm run quality -- --format github-annotations --fail-on-issues
      - run: npm test
      - run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Commit and tag (manual run)
        if: github.event_name == 'workflow_dispatch' && steps.bump.outputs.resume != 'true'
        env:
          tag: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json versions.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Release $tag"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          node scripts/release-notes.mjs "$tag" > release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" main.js manifest.json styles.css --clobber
          else
            flags=""
            if [ "$PRERELEASE" = "true" ] || [[ "$tag" == *-* ]]; then flags="--prerelease"; fi
            gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag $flags \
              main.js manifest.json styles.css
          fi
