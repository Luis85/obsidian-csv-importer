name: Release

# Three ways to release:
# 1. Fully automated: run this workflow manually (Actions tab, `gh workflow run release.yml -f version=minor`,
#    or an agent via the GitHub API). It runs the mutation tests (job `mutation`), then bumps the version, commits, tags,
#    checks code quality (fallow), builds, tests and publishes.
# 2. Push a tag equal to the manifest.json version (e.g. `git push origin 1.2.3`).
# 3. Publish a release in the GitHub UI with a new tag equal to the manifest.json version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version: current (release manifest version as-is), patch, minor, major, or an explicit x.y.z"
        required: true
        default: patch
      prerelease:
        description: "Mark as pre-release (BRAT still installs it; the community store ignores it)"
        type: boolean
        default: false
  push:
    tags:
      - "*.*.*"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mutation:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the release when the mutation score drops below `thresholds.break` in stryker.config.mjs.
      - run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore

  release:
    needs: mutation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Bump version (manual run)
        if: github.event_name == 'workflow_dispatch'
        id: bump
        env:
          VERSION_INPUT: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "branch" ]; then
            echo "Run this workflow from a branch (selected ref '$GITHUB_REF_NAME' is a $REF_TYPE)." >&2
            exit 1
          fi
          version="$(node scripts/prepare-release.mjs "$VERSION_INPUT")"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists. Choose another version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Resolve tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          BUMPED: ${{ steps.bump.outputs.version }}
          REF_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then tag="$BUMPED"; else tag="$REF_TAG"; fi
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag '$tag' does not match manifest.json version '$version'" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: npm run lint
      # Code quality (fallow): fails on dead code, duplication or complexity not in .fallow-baselines/.
      - run: npm run quality
      - run: npm test
      - run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            styles.css

      - name: Commit and tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          tag: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json versions.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Release $tag"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          node scripts/release-notes.mjs "$tag" > release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" main.js manifest.json styles.css --clobber
          else
            flags=""
            if [ "$PRERELEASE" = "true" ] || [[ "$tag" == *-* ]]; then flags="--prerelease"; fi
            gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag $flags \
              main.js manifest.json styles.css
          fi
